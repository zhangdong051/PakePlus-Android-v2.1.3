        // 视频播放相关函数
        async function startVideoPlay() {
            try {
                // 显示加载状态
                document.getElementById('video-loading').style.display = 'block';
                document.getElementById('video-error').style.display = 'none';
                document.getElementById('video-status').textContent = '视频：加载中...';

                // 关闭已有连接
                if (videoSdk) {
                    await videoSdk.close();
                }

                videoSdk = new SrsRtcWhipWhepAsync();

                // 将SDK的流绑定到两个视频元素
                document.getElementById('remote-video').srcObject = videoSdk.stream;
                document.getElementById('small-remote-video').srcObject = videoSdk.stream;

                // 使用roomId和配置的视频服务器地址动态生成视频地址
                const whepUrl = `http://${config.videoServer}:1985/rtc/v1/whep/?app=live&stream=${roomId}.flv`;
                console.log('视频地址:', whepUrl);

                await videoSdk.play(whepUrl, {
                    videoOnly: true,  // 只播放视频
                    audioOnly: false
                });

                // 隐藏加载状态，更新状态信息
                document.getElementById('video-loading').style.display = 'none';
                document.getElementById('video-status').textContent = '视频：播放中';
                isVideoPlaying = true;

            } catch (error) {
                console.error('视频播放错误:', error);
                document.getElementById('video-loading').style.display = 'none';
                document.getElementById('video-error').style.display = 'block';
                document.getElementById('video-status').textContent = '视频：加载失败';

                // 清理连接
                if (videoSdk) {
                    try {
                        await videoSdk.close();
                    } catch (closeErr) {
                        console.error('关闭视频连接错误:', closeErr);
                    }
                    videoSdk = null;
                }
                isVideoPlaying = false;
            }
        }

        // 停止视频播放
        async function stopVideoPlay() {
            if (videoSdk) {
                try {
                    await videoSdk.close();
                    document.getElementById('video-status').textContent = '视频：已停止';
                } catch (error) {
                    console.error('停止视频错误:', error);
                    document.getElementById('video-status').textContent = '视频：停止失败';
                }
                videoSdk = null;
                isVideoPlaying = false;
            }
        }

        // 重新加载视频
        async function restartVideoPlay() {
            await stopVideoPlay();
            await startVideoPlay();
        }

        function toggleViews() {
            const body = document.body;
            const isVideoMode = body.classList.contains('show-video-large');

            // 保存当前大窗口状态
            if (isVideoMode) {
                saveVideoState();
                applyMapState();
            } else {
                saveMapState();
                applyVideoState();
            }

            // 切换显示模式类
            body.classList.toggle('show-video-large');
            body.classList.toggle('show-map-large');

            // 关键修复：强制地图重新计算尺寸
            setTimeout(() => {
                if (window.largeMap) window.largeMap.resize();
                if (window.smallMap) window.smallMap.resize();
            }, 50); // 短暂延迟确保DOM已更新

            // 同步小窗口内容
            syncSmallWindowContent();
        }
        // 保存视频窗口状态
        function saveVideoState() {
            windowState.video.zoom = 1;
        }

        // 应用视频窗口状态
        function applyVideoState() {
            const videoElement = document.getElementById('remote-video');
            if (videoElement) {
                videoElement.style.transform = `scale(${windowState.video.zoom})`;
            }
        }

        // 保存地图窗口状态
        function saveMapState() {
            if (window.largeMap) {
                windowState.map.zoom = window.largeMap.getZoom();
                windowState.map.center = window.largeMap.getCenter();
            }
        }

        // 应用地图窗口状态
        function applyMapState() {
            if (window.largeMap) {
                window.largeMap.setZoomAndCenter(
                    windowState.map.zoom,
                    windowState.map.center
                );
            }
        }

        // 同步小窗口内容与大窗口
        function syncSmallWindowContent() {
            const isVideoMode = document.body.classList.contains('show-video-large');

            if (isVideoMode) {
                if (window.largeMap && window.smallMap) {
                    window.smallMap.setZoomAndCenter(
                        window.largeMap.getZoom(),
                        window.largeMap.getCenter()
                    );
                }
            }
        }

        // 初始化地图 - 创建两个地图实例，保持同步
        function initMaps() {
            // 大地图
            window.largeMap = new AMap.Map("map-container", {
                zoom: windowState.map.zoom,
                center: windowState.map.center,
                resizeEnable: true,
                rotateEnable: true,//是否开启地图旋转交互 鼠标右键 + 鼠标画圈移动 或 键盘Ctrl + 鼠标画圈移动
                pitchEnable: true,
                pitch: 0,
                rotation: 0,
                viewMode: '2D',//开启3D视图,默认为关闭
                zooms: [2, 20],
                terrain: true// 开启地形图


            });

            // 小地图
            window.smallMap = new AMap.Map("small-map-container", {
                zoom: windowState.map.zoom,
                center: windowState.map.center,
                resizeEnable: true,
                rotateEnable: false,
                pitchEnable: false,
                viewMode: '2D',
                zooms: [2, 20]
            });

            // 为两个地图添加相同的控件和设置
            setupMap(window.largeMap);
            setupMap(window.smallMap);

            // 监听大地图事件，同步到小地图
            window.largeMap.on('zoomend', function () {
                if (document.body.classList.contains('show-map-large')) {
                    window.smallMap.setZoom(window.largeMap.getZoom());
                }
            });

            window.largeMap.on('moveend', function () {
                if (document.body.classList.contains('show-map-large')) {
                    window.smallMap.setCenter(window.largeMap.getCenter());
                }
            });

            // 初始化飞机标记
            initDroneMarker();
        }

        // 地图设置 - 已移除罗盘和缩放控件
        function setupMap(map) {
            // 仅保留比例尺控件
            AMap.plugin(["AMap.Scale"], function () {
                map.addControl(new AMap.Scale());
            });

            // 保留图层切换控件
            AMapUI.loadUI(['control/BasicControl'], function (BasicControl) {
                var layerCtrl = new BasicControl.LayerSwitcher({
                    theme: 'common',
                    position: 'tr'
                });
                map.addControl(layerCtrl);
            });

            // 地图点击事件
            map.on('click', function (e) {
                const lngLatInput = document.getElementById("lngLatInfo");
                if (lngLatInput) {
                    lngLatInput.value = e.lnglat.getLng() + ',' + e.lnglat.getLat();
                }
                console.log(e.lnglat.getLng() + ',' + e.lnglat.getLat());
            });
        }

        // 初始化无人机标记 - 使用在线图标确保显示
        function initDroneMarker() {
            const initialLon = window.initialLon || 114.388185;
            const initialLat = window.initialLat || 36.148881;

            const position = [initialLon, initialLat];
            // 使用无人机图标显示
            const icon = new AMap.Icon({
                size: new AMap.Size(35, 35),
                image: 'quadx.png', // 替换为实际无人机图标URL
                imageOffset: new AMap.Pixel(0, 0),
                anchor: 'center', // 旋转中心点（图标中心）
                imageSize: new AMap.Size(35, 35),
            });

            // 大地图标记
            window.largeMarker = new AMap.Marker({
                position: position,
                map: window.largeMap,
                icon: icon,
                zIndex: 400,

            });

            // 小地图标记（同样添加旋转属性）
            window.smallMarker = new AMap.Marker({
                position: position,
                map: window.smallMap,
                icon: icon,
                zIndex: 400,

            });
            //等待加入mark旋转逻辑
        }

        // 修改updateMarkerPosition函数，添加航迹绘制逻辑
        // 修改updateMarkerPosition函数，添加绘制状态判断
        function updateMarkerPosition() {
            const currentLon = parseFloat(window.initialLon);
            const currentLat = parseFloat(window.initialLat);
            if (isNaN(currentLon) || isNaN(currentLat)) return;

            const newPosition = [currentLon, currentLat];
            window.largeMarker.setPosition(newPosition);
            window.smallMarker.setPosition(newPosition);

            // 添加新位置到航迹数组
            flightPath.push(newPosition);

            // 限制航迹点数量
            if (flightPath.length > MAX_PATH_POINTS) {
                flightPath.shift(); // 移除最早的点
            }

            // 绘制航迹线
            drawFlightPath();

            // 只在非绘制状态下更新地图中心
            if (!isDrawing) {
                // 保持原有的地图居中逻辑
                if (document.body.classList.contains('show-video-large')) {
                    window.smallMap.setCenter(newPosition);
                } else {
                    window.largeMap.setCenter(newPosition);
                }
            }
        }

        // 添加绘制航迹线的函数
        function drawFlightPath() {
            // 至少需要两个点才能绘制线段
            if (flightPath.length < 2) return;

            // 定义航迹线样式：灰色虚线
            const pathStyle = {
                strokeColor: "#999", // 灰色
                strokeWeight: 2,
                strokeStyle: "dashed", // 虚线
                strokeDasharray: [10, 5], // 虚线样式
                zIndex: 350 // 确保在标记下方
            };

            // 更新或创建大地图航迹线
            if (pathLineLarge) {
                pathLineLarge.setPath(flightPath);
            } else {
                pathLineLarge = new AMap.Polyline({
                    path: flightPath,
                    ...pathStyle,
                    map: window.largeMap
                });
            }

            // 更新或创建小地图航迹线
            if (pathLineSmall) {
                pathLineSmall.setPath(flightPath);
            } else {
                pathLineSmall = new AMap.Polyline({
                    path: flightPath,
                    ...pathStyle,
                    map: window.smallMap
                });
            }
        }

        // 添加清除航迹的函数（可选，用于需要重置航迹的场景）
        function clearFlightPath() {
            flightPath = [];
            if (pathLineLarge) {
                pathLineLarge.remove();
                pathLineLarge = null;
            }
            if (pathLineSmall) {
                pathLineSmall.remove();
                pathLineSmall = null;
            }
        }


        // 地图搜索功能
        function searchLocation() {
            const input = document.getElementById('search-input').value.trim();
            if (!input) return;

            const [lng, lat] = input.split(',').map(Number);
            if (!isNaN(lng) && !isNaN(lat)) {
                window.largeMap.setCenter([lng, lat]);
                window.smallMap.setCenter([lng, lat]);
                windowState.map.center = [lng, lat];
            }
        }



        // 切换航线执行面板
        function toggleExecutionPanel() {
            const panel = document.getElementById('execution-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }



        // 页面加载时从本地存储读取并设置输入框值
			document.addEventListener('DOMContentLoaded', function () {
				const splashScreen = document.getElementById('splash-screen');

				// 点击图片关闭启动界面
				splashScreen.addEventListener('click', function () {
					splashScreen.style.opacity = '0';
					setTimeout(() => {
						splashScreen.style.display = 'none';
					}, 500);
				});

				// 设置服务器地址输入框的值
				const videoServerInput = document.getElementById('video-server');
				const mqttServerInput = document.getElementById('mqtt-server');
				const roomIdInput = document.querySelector("#roomIdInput");
				const droneModelSelect = document.getElementById('drone-model');
				if (videoServerInput) videoServerInput.value = config.videoServer;
				if (mqttServerInput) mqttServerInput.value = config.mqttServer;
				
				// 修复5：强制从localStorage读取并设置RoomId输入框
				const savedRoomId = localStorage.getItem('droneRoomId');
				if (savedRoomId && roomIdInput) {
					roomIdInput.value = savedRoomId;
					// 同步更新内存中的roomId
					roomId = savedRoomId;
					//console.log('DOM加载完成，从localStorage读取RoomId:', roomId);
				} else if (roomIdInput) {
					roomIdInput.value = '864284040600000';
				}
				    // 新增：初始化机型下拉框（核心修改）
				if (droneModelSelect) {
					const savedDroneModel = localStorage.getItem('droneModel') || 'HXV2';
					droneModelSelect.value = savedDroneModel;
					// 同步更新config中的值（兜底）
					config.droneModel = savedDroneModel;
				}
			});


        // 页面加载完成后初始化
        window.onload = () => {
            initMaps();
            syncSmallWindowContent();

        };
    </script>
</body>
