<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRS WebRTC 音视频推流</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        .card-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .card-title i {
            margin-right: 10px;
            font-size: 1.8rem;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
        }
        
        .video-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .video-wrapper h3 {
            position: absolute;
            top: 10px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        video {
            width: 100%;
            height: 300px;
            display: block;
            object-fit: cover;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .btn i {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(45deg, #0072ff, #00c6ff);
            transform: translateY(-3px);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }
        
        .btn-danger:hover {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            transform: translateY(-3px);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #7b4397, #dc2430);
            color: white;
        }
        
        .btn-secondary:hover {
            background: linear-gradient(45deg, #dc2430, #7b4397);
            transform: translateY(-3px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1rem;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .status.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
        }
        
        .status.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .status.info {
            background: rgba(23, 162, 184, 0.2);
            border: 1px solid rgba(23, 162, 184, 0.5);
        }
        
        .status-content {
            display: flex;
            align-items: center;
        }
        
        .status-content i {
            font-size: 1.5rem;
            margin-right: 10px;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .config-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .debug-panel {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .debug-panel h3 {
            margin-bottom: 10px;
        }
        
        .debug-content {
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
        }
        
        .network-test {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .network-test h3 {
            margin-bottom: 10px;
        }
        
        .network-test button {
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            background: rgba(0, 123, 255, 0.3);
            color: white;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-broadcast-tower"></i> SRS WebRTC 音视频推流</h1>
            <p class="subtitle">通过WebRTC技术将麦克风语音和摄像头视频推流到SRS服务器</p>
        </header>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-server"></i> 服务器配置</h2>
            <div class="config-grid">
                <div class="form-group">
                    <label for="serverUrl"><i class="fas fa-link"></i> SRS服务器地址</label>
                    <input type="text" id="serverUrl" value="http://42.236.69.165:1985" placeholder="例如: http://your-srs-server.com:1985">
                </div>
                <div class="form-group">
                    <label for="appName"><i class="fas fa-layer-group"></i> 应用名称</label>
                    <input type="text" id="appName" value="live" placeholder="例如: live">
                </div>
                <div class="form-group">
                    <label for="streamName"><i class="fas fa-signal"></i> 流名称</label>
                    <input type="text" id="streamName" value="m4ta.flv" placeholder="例如: test.flv">
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2 class="card-title"><i class="fas fa-video"></i> 视频预览</h2>
            <div class="video-container">
                <div class="video-wrapper">
                    <h3>本地预览</h3>
                    <video id="localVideo" autoplay muted></video>
                </div>
                <div class="video-wrapper">
                    <h3>远程播放</h3>
                    <video id="remoteVideo" autoplay></video>
                </div>
            </div>
            
            <div class="controls">
                <button id="btnPublish" class="btn btn-primary">
                    <i class="fas fa-play"></i> 开始推流
                </button>
                <button id="btnStop" class="btn btn-danger" disabled>
                    <i class="fas fa-stop"></i> 停止推流
                </button>
                <button id="btnPlay" class="btn btn-secondary">
                    <i class="fas fa-play-circle"></i> 播放流
                </button>
                <button id="btnMuteAudio" class="btn">
                    <i class="fas fa-microphone"></i> 静音音频
                </button>
                <button id="btnMuteVideo" class="btn">
                    <i class="fas fa-video"></i> 关闭视频
                </button>
            </div>
            
            <div class="network-test">
                <h3><i class="fas fa-network-wired"></i> 网络连接测试</h3>
                <button id="btnTestServer">测试服务器连接</button>
                <button id="btnTestCORS">测试CORS支持</button>
                <button id="btnTestWHEP">测试WHEP端点</button>
            </div>
            
            <div class="debug-panel">
                <h3><i class="fas fa-bug"></i> 调试信息</h3>
                <div class="debug-content" id="debugLog">
                    等待操作...
                </div>
            </div>
        </div>
        
        <div id="statusMessage" class="status">
            <div class="status-content">
                <i class="fas fa-info-circle"></i>
                <div class="status-text">页面加载完成，点击"开始推流"按钮以启动音视频推流</div>
            </div>
        </div>
        
        <div class="footer">
            <p>基于WebRTC技术的SRS音视频推流解决方案 | 确保SRS服务器已正确配置WebRTC功能</p>
        </div>
    </div>

    <script>
        // 全局变量
        let localStream = null;
        let peerConnection = null;
        let audioTrack = null;
        let videoTrack = null;
        let audioEnabled = true;
        let videoEnabled = true;
        
        // DOM元素
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const btnPublish = document.getElementById('btnPublish');
        const btnStop = document.getElementById('btnStop');
        const btnPlay = document.getElementById('btnPlay');
        const btnMuteAudio = document.getElementById('btnMuteAudio');
        const btnMuteVideo = document.getElementById('btnMuteVideo');
        const serverUrlInput = document.getElementById('serverUrl');
        const appNameInput = document.getElementById('appName');
        const streamNameInput = document.getElementById('streamName');
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.querySelector('.status-text');
        const statusIcon = document.querySelector('.status-content i');
        const debugLog = document.getElementById('debugLog');
        const btnTestServer = document.getElementById('btnTestServer');
        const btnTestCORS = document.getElementById('btnTestCORS');
        const btnTestWHEP = document.getElementById('btnTestWHEP');
        
        // 添加调试日志
        function addDebugLog(message) {
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            debugLog.appendChild(logEntry);
            debugLog.scrollTop = debugLog.scrollHeight;
        }
        
        // 显示状态信息
        function showStatus(message, type = 'info') {
            statusText.textContent = message;
            statusMessage.className = 'status ' + type;
            statusMessage.style.display = 'flex';
            addDebugLog(message);
            
            // 更新图标
            if (type === 'success') {
                statusIcon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                statusIcon.className = 'fas fa-exclamation-circle';
            } else {
                statusIcon.className = 'fas fa-info-circle';
            }
            
            // 5秒后自动隐藏信息（错误信息除外）
            if (type !== 'error') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        }
        
        // 获取媒体设备权限
        async function getMediaStream() {
            try {
                showStatus('正在请求摄像头和麦克风权限...', 'info');
                
                const constraints = {
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        channelCount: 1
                    },
                    video: {
                        width: { min: 640, ideal: 1280, max: 1920 },
                        height: { min: 480, ideal: 720, max: 1080 },
                        frameRate: { ideal: 30, max: 60 },
                        aspectRatio: 16/9
                    }
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                
                // 获取音视频轨道用于后续控制
                audioTrack = localStream.getAudioTracks()[0];
                videoTrack = localStream.getVideoTracks()[0];
                
                showStatus('媒体设备权限获取成功', 'success');
                return true;
            } catch (error) {
                console.error('获取媒体设备权限失败:', error);
                showStatus(`获取媒体设备权限失败: ${error.message}`, 'error');
                return false;
            }
        }
        
        // 创建PeerConnection
        function createPeerConnection() {
            // 创建RTCPeerConnection，可以添加STUN服务器以提高连接成功率
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            // 添加本地流的所有轨道到PeerConnection
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }
            
            // 监听ICE候选信息
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    addDebugLog(`ICE候选信息: ${event.candidate.candidate}`);
                }
            };
            
            // 监听连接状态变化
            peerConnection.onconnectionstatechange = () => {
                addDebugLog(`连接状态: ${peerConnection.connectionState}`);
                switch(peerConnection.connectionState) {
                    case 'connected':
                        showStatus('与SRS服务器连接成功', 'success');
                        break;
                    case 'disconnected':
                    case 'failed':
                        showStatus('与SRS服务器连接断开', 'error');
                        break;
                }
            };
        }
        
        // 推流到SRS
        async function publishStream() {
            if (!localStream) {
                const hasMedia = await getMediaStream();
                if (!hasMedia) return;
            }
            
            try {
                showStatus('正在建立推流连接...', 'info');
                
                createPeerConnection();
                
                // 获取服务器配置
                const serverUrl = serverUrlInput.value;
                const appName = appNameInput.value;
                const streamName = streamNameInput.value;
                const publishUrl = `${serverUrl}/rtc/v1/publish/`;
                
                // 正确构造streamUrl
                const serverHost = serverUrl.split('//')[1].split(':')[0];
                const streamUrl = `webrtc://${serverHost}/${appName}/${streamName}`;
                
                addDebugLog(`推流URL: ${publishUrl}`);
                addDebugLog(`流URL: ${streamUrl}`);
                
                // 创建offer
                const offer = await peerConnection.createOffer({
                    offerToReceiveAudio: false,
                    offerToReceiveVideo: false
                });
                await peerConnection.setLocalDescription(offer);
                
                // 发送SDP到SRS服务器
                const response = await fetchWithRetry(publishUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api: publishUrl,
                        streamurl: streamUrl,
                        sdp: offer.sdp
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP错误! 状态: ${response.status}, 响应: ${errorText}`);
                }
                
                const data = await response.json();
                
                if (data.code !== 0) {
                    throw new Error(`SRS服务器错误: ${data.code} - ${data.message}`);
                }
                
                // 设置远程SDP
                await peerConnection.setRemoteDescription(
                    new RTCSessionDescription({ type: 'answer', sdp: data.sdp })
                );
                
                // 更新UI状态
                btnPublish.disabled = true;
                btnStop.disabled = false;
                btnPlay.disabled = false;
                
                showStatus('推流成功建立', 'success');
                
            } catch (error) {
                console.error('推流失败:', error);
                showStatus(`推流失败: ${error.message}`, 'error');
                
                // 清理资源
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }
        
        // 带重试机制的fetch请求
        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    
                    // 如果是服务器错误，重试可能有效
                    if (response.status >= 500) {
                        throw new Error(`服务器错误: ${response.status}`);
                    }
                    
                    return response;
                } catch (error) {
                    if (i === retries - 1) throw error;
                    addDebugLog(`请求失败，${delay}ms后重试... (${i+1}/${retries})`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
        }
        
        // 从SRS播放流（使用WHEP协议）
        async function playStream() {
            try {
                showStatus('正在建立播放连接...', 'info');
                
                // 获取服务器配置
                const serverUrl = serverUrlInput.value;
                const appName = appNameInput.value;
                const streamName = streamNameInput.value;
                
                // 使用WHEP协议端点
                const playUrl = `${serverUrl}/rtc/v1/whep/?app=${encodeURIComponent(appName)}&stream=${encodeURIComponent(streamName)}`;
                
                addDebugLog(`播放URL: ${playUrl}`);
                
                // 创建播放用的PeerConnection
                const playerPeerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' }
                    ]
                });
                
                // 监听远程流
                playerPeerConnection.ontrack = (event) => {
                    if (event.streams && event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        showStatus('播放连接建立成功', 'success');
                    }
                };
                
                // 监听ICE候选信息
                playerPeerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        addDebugLog(`播放ICE候选信息: ${event.candidate.candidate}`);
                    }
                };
                
                // 创建播放offer
                const offer = await playerPeerConnection.createOffer();
                await playerPeerConnection.setLocalDescription(offer);
                
                addDebugLog(`发送播放SDP: ${offer.sdp.substring(0, 100)}...`);
                
                // 发送SDP到SRS服务器（使用WHEP协议）
                const response = await fetchWithRetry(playUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: offer.sdp
                });
                
                // 检查响应状态
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP错误! 状态: ${response.status}, 响应: ${errorText}`);
                }
                
                const sdpAnswer = await response.text();
                addDebugLog(`接收播放SDP: ${sdpAnswer.substring(0, 100)}...`);
                
                // 设置远程SDP
                await playerPeerConnection.setRemoteDescription(
                    new RTCSessionDescription({ type: 'answer', sdp: sdpAnswer })
                );
                
                showStatus('播放流已启动', 'success');
                
            } catch (error) {
                console.error('播放流失败:', error);
                showStatus(`播放流失败: ${error.message}`, 'error');
            }
        }
        
        // 停止推流
        function stopStream() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                localVideo.srcObject = null;
            }
            
            // 更新UI状态
            btnPublish.disabled = false;
            btnStop.disabled = true;
            btnPlay.disabled = true;
            
            showStatus('推流已停止', 'info');
        }
        
        // 切换音频状态
        function toggleAudio() {
            if (audioTrack) {
                audioEnabled = !audioEnabled;
                audioTrack.enabled = audioEnabled;
                btnMuteAudio.innerHTML = audioEnabled ? 
                    '<i class="fas fa-microphone"></i> 静音音频' : 
                    '<i class="fas fa-microphone-slash"></i> 取消静音';
                showStatus(audioEnabled ? '音频已启用' : '音频已静音', 'info');
            }
        }
        
        // 切换视频状态
        function toggleVideo() {
            if (videoTrack) {
                videoEnabled = !videoEnabled;
                videoTrack.enabled = videoEnabled;
                btnMuteVideo.innerHTML = videoEnabled ? 
                    '<i class="fas fa-video"></i> 关闭视频' : 
                    '<i class="fas fa-video-slash"></i> 开启视频';
                showStatus(videoEnabled ? '视频已启用' : '视频已关闭', 'info');
            }
        }
        
        // 测试服务器连接
        async function testServerConnection() {
            try {
                showStatus('正在测试服务器连接...', 'info');
                const serverUrl = serverUrlInput.value;
                
                // 发送HEAD请求测试连接
                const response = await fetch(serverUrl, {
                    method: 'HEAD',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (response.ok) {
                    showStatus(`服务器连接成功! 状态: ${response.status}`, 'success');
                } else {
                    showStatus(`服务器响应异常! 状态: ${response.status}`, 'error');
                }
            } catch (error) {
                showStatus(`服务器连接失败: ${error.message}`, 'error');
            }
        }
        
        // 测试CORS支持
        async function testCORS() {
            try {
                showStatus('正在测试CORS支持...', 'info');
                const serverUrl = serverUrlInput.value;
                const appName = appNameInput.value;
                const streamName = streamNameInput.value;
                const playUrl = `${serverUrl}/rtc/v1/whep/?app=${encodeURIComponent(appName)}&stream=${encodeURIComponent(streamName)}`;
                
                // 发送OPTIONS请求测试CORS
                const response = await fetch(playUrl, {
                    method: 'OPTIONS',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (response.ok) {
                    const corsHeaders = {
                        'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                        'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                        'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers')
                    };
                    
                    if (corsHeaders['Access-Control-Allow-Origin']) {
                        showStatus(`CORS支持正常! 允许的来源: ${corsHeaders['Access-Control-Allow-Origin']}`, 'success');
                    } else {
                        showStatus('CORS支持不完整! 缺少必要的CORS头', 'error');
                    }
                } else {
                    showStatus(`CORS测试失败! 状态: ${response.status}`, 'error');
                }
            } catch (error) {
                showStatus(`CORS测试失败: ${error.message}`, 'error');
            }
        }
        
        // 测试WHEP端点
        async function testWHEPEndpoint() {
            try {
                showStatus('正在测试WHEP端点...', 'info');
                const serverUrl = serverUrlInput.value;
                const appName = appNameInput.value;
                const streamName = streamNameInput.value;
                const playUrl = `${serverUrl}/rtc/v1/whep/?app=${encodeURIComponent(appName)}&stream=${encodeURIComponent(streamName)}`;
                
                // 发送测试请求
                const response = await fetch(playUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp'
                    },
                    body: 'v=0\r\no=- 0 0 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\n'
                });
                
                if (response.status === 200) {
                    showStatus('WHEP端点响应正常!', 'success');
                } else if (response.status === 400) {
                    showStatus('WHEP端点返回400错误，请检查参数', 'error');
                } else if (response.status === 404) {
                    showStatus('WHEP端点不存在(404)', 'error');
                } else if (response.status === 405) {
                    showStatus('WHEP端点不允许POST方法(405)', 'error');
                } else {
                    showStatus(`WHEP端点返回异常状态: ${response.status}`, 'error');
                }
            } catch (error) {
                showStatus(`WHEP端点测试失败: ${error.message}`, 'error');
            }
        }
        
        // 事件监听
        btnPublish.addEventListener('click', publishStream);
        btnStop.addEventListener('click', stopStream);
        btnPlay.addEventListener('click', playStream);
        btnMuteAudio.addEventListener('click', toggleAudio);
        btnMuteVideo.addEventListener('click', toggleVideo);
        btnTestServer.addEventListener('click', testServerConnection);
        btnTestCORS.addEventListener('click', testCORS);
        btnTestWHEP.addEventListener('click', testWHEPEndpoint);
        
        // 页面加载时显示初始状态
        window.addEventListener('load', () => {
            showStatus('页面加载完成，点击"开始推流"按钮以启动音视频推流', 'info');
            addDebugLog('页面加载完成');
        });
    </script>
